name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

  package:
    name: Package (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            formats: deb,appimage
          - name: windows
            os: windows-latest
            formats: nsis,wix
          - name: macos
            os: macos-latest
            formats: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libwayland-dev libfuse2 file
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager

      - name: Build (Linux / Windows)
        if: runner.os != 'macOS'
        run: cargo build --release --locked

      - name: Build universal binary (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/photovault \
            target/aarch64-apple-darwin/release/photovault \
            target/x86_64-apple-darwin/release/photovault
          lipo -info target/release/photovault

      - name: Package
        run: cargo packager --release --formats ${{ matrix.formats }} --out-dir dist

      - name: RPM package for dnf (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm --output dist/

      - name: Arch package for pacman (Linux)
        if: runner.os == 'Linux'
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          sed -i "s/^pkgver=.*/pkgver=${version}/" packaging/arch/PKGBUILD
          docker run --rm -v "$PWD":/w archlinux:base-devel bash -c '
            useradd -m builder &&
            chown -R builder /w/packaging/arch &&
            chmod -R a+rX /w &&
            cd /w/packaging/arch &&
            su builder -c "PKGDEST=/w/packaging/arch makepkg -f --nodeps"'
          sudo cp packaging/arch/*.pkg.tar.zst dist/
          ls -la dist

      - name: Portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable/PhotoVault | Out-Null
          Copy-Item target/release/photovault.exe portable/PhotoVault/PhotoVault.exe
          Copy-Item README.md, LICENSE portable/PhotoVault/
          Compress-Archive -Path portable/PhotoVault -DestinationPath dist/PhotoVault-${{ github.ref_name }}-windows-x64-portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: photovault-${{ matrix.name }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.AppImage
            dist/*.dmg
            dist/*.msi
            dist/*-setup.exe
            dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
